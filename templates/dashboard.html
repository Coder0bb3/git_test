{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
{% if current_user.subscribed %}
  <p>Your stock picks:</p>
  <ul>
    {% for stock in picks %}
      <li>{{ stock }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>You are not subscribed. <a href="{{ url_for('subscribe') }}">Subscribe now</a> to see our top stock picks.</p>
{% endif %}
<p><a href="{{ url_for('logout') }}">Logout</a></p>
{% endblock %}
